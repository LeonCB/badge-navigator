name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Code ophalen
        uses: actions/checkout@v5

      - name: Versie uit de tag in de badge zetten
        run: |
          sed -i "s/const BADGE_NAVIGATOR_VERSION = \".*\";/const BADGE_NAVIGATOR_VERSION = \"$GITHUB_REF_NAME\";/" badge-navigator.js
          grep -n "const BADGE_NAVIGATOR_VERSION" badge-navigator.js

      - name: JS-bestand aan de release hangen
        run: gh release upload "$GITHUB_REF_NAME" badge-navigator.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
